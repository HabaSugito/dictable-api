<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hark live captions</title>
  <style>
    :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #86868b; --accent: #0a84ff; --card: #fff; --border: #e5e5ea; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --accent: #0a84ff; --card: #2c2c2e; --border: #3a3a3c; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.hint { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    .controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    #transcript { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-height: 200px; }
    .final { margin: 0 0 8px; }
    .partial { color: var(--muted); }
    #status { font-size: 13px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>Hark live captions</h1>
  <p class="hint">Serve this page from localhost (<code>python3 -m http.server -d examples 8000</code>) and open http://localhost:8000/mic.html.</p>
  <div class="controls">
    <select id="lang">
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
      <option value="de-DE">Deutsch</option>
      <option value="fr-FR">Français</option>
      <option value="es-ES">Español</option>
      <option value="ko-KR">한국어</option>
    </select>
    <button id="toggle">Start microphone</button>
  </div>
  <div id="transcript"><span class="partial" id="partial"></span></div>
  <div id="status">Idle</div>
</main>
<script>
// Captures the microphone, converts it to 16 kHz 16-bit mono PCM and streams it to Hark Server.
const worklet = `
class Pcm extends AudioWorkletProcessor {
  process([input]) {
    if (input[0]) this.port.postMessage(input[0].slice(0));
    return true;
  }
}
registerProcessor('pcm', Pcm);`;

let ws, ctx, stream;
const $ = (id) => document.getElementById(id);

async function start() {
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  ctx = new AudioContext({ sampleRate: 16000 }); // the browser resamples the mic for us
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([worklet], { type: 'text/javascript' })));
  const node = new AudioWorkletNode(ctx, 'pcm');
  ctx.createMediaStreamSource(stream).connect(node);

  ws = new WebSocket('ws://127.0.0.1:8082/v1/stream');
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'hello') ws.send(JSON.stringify({ type: 'start', language: $('lang').value, sample_rate: 16000 }));
    if (msg.type === 'ready') $('status').textContent = `Listening (${msg.locale})`;
    if (msg.type === 'status') $('status').textContent = msg.message;
    if (msg.type === 'partial') $('partial').textContent = msg.text;
    if (msg.type === 'final') {
      const p = document.createElement('p');
      p.className = 'final';
      p.textContent = msg.text;
      $('partial').before(p);
      $('partial').textContent = '';
    }
    if (msg.type === 'error') $('status').textContent = 'Error: ' + msg.message;
  };
  ws.onclose = () => ($('status').textContent = 'Disconnected');
  ws.onerror = () => ($('status').textContent = 'Could not connect. Is Hark Server running?');

  node.port.onmessage = ({ data }) => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const pcm = new Int16Array(data.length);
    for (let i = 0; i < data.length; i++) pcm[i] = Math.max(-1, Math.min(1, data[i])) * 0x7fff;
    ws.send(pcm.buffer);
  };
  $('toggle').textContent = 'Stop';
}

function stop() {
  ws?.send(JSON.stringify({ type: 'stop' }));
  stream?.getTracks().forEach((t) => t.stop());
  ctx?.close();
  ws = ctx = stream = null;
  $('toggle').textContent = 'Start microphone';
}

$('toggle').onclick = () => (ctx ? stop() : start().catch((e) => ($('status').textContent = e.message)));
</script>
</body>
</html>
